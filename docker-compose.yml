# FlowForge — full stack for local evaluation / single-host deployments.
#
#   cp .env.example .env        # then set JWT_SECRET and ENCRYPTION_KEY
#   docker compose up -d --build
#   open http://localhost:3000
#
# Data stores only (for `pnpm dev` on the host):
#   docker compose up -d postgres redis
#
# Scale workers horizontally:
#   docker compose up -d --scale worker=3
name: flowforge

x-app-env: &app-env
  NODE_ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: postgresql://flowforge:${POSTGRES_PASSWORD:-flowforge}@postgres:5432/flowforge?schema=public
  REDIS_URL: redis://redis:6379
  WEB_URL: ${WEB_URL:-http://localhost:3000}
  HOOKS_PUBLIC_URL: ${HOOKS_PUBLIC_URL:-http://localhost:4000}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in .env (openssl rand -base64 32)}
  ENCRYPTION_KEY_VERSION: ${ENCRYPTION_KEY_VERSION:-1}
  ENCRYPTION_KEYS_PREVIOUS: ${ENCRYPTION_KEYS_PREVIOUS:-}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  HTTP_ALLOW_PRIVATE_HOSTS: ${HTTP_ALLOW_PRIVATE_HOSTS:-}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: flowforge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flowforge}
      POSTGRES_DB: flowforge
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U flowforge -d flowforge']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # AOF persistence: queued/delayed jobs survive restarts. noeviction is required by BullMQ.
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build: { context: ., dockerfile: docker/Dockerfile, target: migrate }
    image: flowforge-migrate
    environment:
      DATABASE_URL: postgresql://flowforge:${POSTGRES_PASSWORD:-flowforge}@postgres:5432/flowforge?schema=public
    depends_on:
      postgres: { condition: service_healthy }
    restart: 'no'

  api:
    build: { context: ., dockerfile: docker/Dockerfile, target: api }
    image: flowforge-api
    restart: unless-stopped
    environment:
      <<: *app-env
      API_PORT: 4000
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (openssl rand -base64 48)}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:3000/api/v1/auth/google/callback}
    ports:
      - '${API_PORT:-4000}:4000' # public webhooks (/hooks/*) are served here
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  worker:
    build: { context: ., dockerfile: docker/Dockerfile, target: worker }
    image: flowforge-worker
    restart: unless-stopped
    environment:
      <<: *app-env
      RUN_CONCURRENCY: ${RUN_CONCURRENCY:-10}
      CODE_MEMORY_MB: ${CODE_MEMORY_MB:-64}
      CODE_TIMEOUT_MS: ${CODE_TIMEOUT_MS:-5000}
    # Give in-flight steps time to finish (they are retried elsewhere if aborted).
    stop_grace_period: 40s
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: web
      args:
        API_INTERNAL_URL: http://api:4000
    image: flowforge-web
    restart: unless-stopped
    ports:
      - '${WEB_PORT:-3000}:3000'
    depends_on:
      api: { condition: service_healthy }

volumes:
  pgdata:
  redisdata:
